name: Build standalone executables

# Builds a packaged desktop app (see app.spec) for Windows and Linux and
# uploads each as a workflow artifact. This is how the Linux build actually
# gets tested on real Linux - it's built on a Windows dev machine, whose
# author can't run a Linux binary locally.
#
# Triggers:
#   - push of a version tag (v1.0.0, v1.2.3, etc.) - also creates/updates a
#     draft GitHub Release with both builds attached.
#   - workflow_dispatch - manual "Run workflow" button, artifacts only (no
#     tag means no release to attach to).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: BackgroundRemover-windows
          - os: ubuntu-latest
            artifact_name: BackgroundRemover-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: pyinstaller app.spec

      - name: Smoke test the built executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "dist/BackgroundRemover/BackgroundRemover.exe"
          if (-not (Test-Path $exe)) { throw "Executable not found: $exe" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            throw "Executable exited early with code $($p.ExitCode) - likely a startup crash (missing import/DLL from the freeze)."
          }
          Write-Output "Executable is alive after 8s (PID $($p.Id)) - no startup crash."
          Stop-Process -Id $p.Id -Force

      - name: Smoke test the built executable (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          EXE="dist/BackgroundRemover/BackgroundRemover"
          test -f "$EXE"
          sudo apt-get install -y xvfb
          # Headless runners have no display, so run it under a virtual X
          # server via xvfb-run. `timeout` gives it a few seconds to start
          # up (importing rembg/onnxruntime/numpy/scipy/tkinter and opening
          # the Tk window) and reaching exit code 124 means it was still
          # running at the deadline - i.e. no startup crash. Any other exit
          # code means it crashed before the timeout fired.
          set +e
          timeout 8s xvfb-run --auto-servernum "$EXE"
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "Executable exited early with code $code - likely a startup crash (missing import/.so from the freeze)."
            exit 1
          fi
          echo "Executable was still running at the 8s deadline - no startup crash."

      - name: Package build output
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../${{ matrix.artifact_name }}.zip" "BackgroundRemover"
          else
            tar -czf "../${{ matrix.artifact_name }}.tar.gz" "BackgroundRemover"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.zip
            ${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: ignore
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/BackgroundRemover-windows/*.zip
            artifacts/BackgroundRemover-linux/*.tar.gz
